name: Update climate and ocean indices

on:
  workflow_dispatch:

  schedule:
    - cron: '17 5 * * *'
  #    timezone: "America/Santiago"

permissions:
  contents: write

jobs:
  update-roni:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run RONI updater
        run: python scripts/update_roni.py

      - name: Inspect generated products
        run: |
          echo "=== Last rows of RONI CSV ==="
          tail -n 5 data/roni.csv

          echo ""
          echo "=== Metadata ==="
          cat metadata/roni.json

      - name: Commit updated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/roni.csv
          git add data/roni.json
          git add metadata/roni.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update RONI data"
            git push
          fi
