name: Update climate and ocean indices

on:
  workflow_dispatch:

  schedule: # horario en UTC
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  update-roni:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Update RONI
        run: python scripts/update_roni.py
      - name: Update SAM
        run: python scripts/update_sam.py
      - name: Update MJO
        run: python scripts/update_mjo.py
  
      - name: Inspect generated products
        run: |
          echo "=== RONI ==="
          tail -n 5 data/roni.csv
          echo ""
          echo "=== SAM ==="
          tail -n 5 data/sam.csv
          echo ""
          echo "=== MJO ==="
          tail -n 5 data/mjo.csv
          
          echo ""
          echo "=== Metadata ==="
          cat metadata/roni.json

      - name: Commit updated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/roni.csv
          git add data/roni.json
          git add metadata/roni.json

          git add data/sam.csv
          git add data/sam.json
          git add metadata/sam.json

          git add data/mjo.csv
          git add data/mjo.json
          git add metadata/mjo.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update climate index data"
            git push
          fi
